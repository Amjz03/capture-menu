name: Release

# Builds CaptureMenu-Setup.exe (CaptureMenu.exe + installer, no Python needed) and
# CaptureMenu.zip (the Python version, no tests or screenshots), and publishes them as a release.
# Three ways to start it: change the VERSION file on main (e.g. to v0.0.2), run it from the
# Actions tab with a version, or push a tag that starts with "v".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"
          else TAG="$(tr -d '[:space:]' < VERSION)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Stamp the version into the app
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed -i "s/^APP_VERSION = \"[^\"]*\"/APP_VERSION = \"${TAG#v}\"/" capture_menu.py
          grep -n "^APP_VERSION" capture_menu.py

      - name: Build CaptureMenu.exe
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --windowed --name CaptureMenu --icon assets/icon.ico \
            --add-data "assets;assets" --collect-all sdl2dll --collect-all obsws_python capture_menu.py
          test -f dist/CaptureMenu/CaptureMenu.exe

      - name: Build CaptureMenu-Setup.exe
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          "$ISCC" //Q "//DAppVersion=${TAG#v}" installer/installer.iss
          ls -la Output/CaptureMenu-Setup.exe

      - name: Build CaptureMenu.zip
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p out/CaptureMenu
          cp -r assets capture_menu.py config.json requirements.txt README.md LICENSE \
                installer/Setup.cmd installer/setup.ps1 installer/Uninstall.cmd installer/uninstall.ps1 out/CaptureMenu/
          cd out && 7z a -bso0 ../CaptureMenu.zip CaptureMenu

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          **Install:** download **`CaptureMenu-Setup.exe`** below and double-click it. That's it.

          It installs Capture Menu, plus OBS Studio and FFmpeg if you don't have them, connects OBS and starts Capture Menu with Windows. No Python needed. Already installed? Run the new Setup to update; your settings are kept. To remove it: Windows Settings → Apps → Capture Menu → Uninstall.

          If Windows shows "Windows protected your PC", choose **More info → Run anyway**.

          Press **Alt + C** (or **Create** on the controller) to open the menu.

          <sub>`CaptureMenu.zip` is the Python version for tinkering: extract it and run `Setup.cmd`.</sub>
          NOTES
          gh release create "$TAG" Output/CaptureMenu-Setup.exe CaptureMenu.zip --target "$GITHUB_SHA" \
            --title "Capture Menu $TAG" --notes-file notes.md
