name: Release

# Builds CaptureMenu.zip (the app only, no tests or screenshots) and publishes it as a release.
# Run it from the Actions tab with a version like v1.0.0, or push a tag that starts with "v".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CaptureMenu.zip
        run: |
          mkdir -p out/CaptureMenu
          cp -r assets capture_menu.py config.json requirements.txt README.md \
                Setup.cmd setup.ps1 build_exe.bat preview.png out/CaptureMenu/
          cd out && zip -r -q ../CaptureMenu.zip CaptureMenu
          cd .. && unzip -l CaptureMenu.zip | tail -1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          **Install:** download `CaptureMenu.zip` below, extract it somewhere permanent (for example `Documents\CaptureMenu`), then double-click `Setup.cmd`.

          If Windows shows "Windows protected your PC", choose **More info → Run anyway**. Setup installs Python, OBS Studio and FFmpeg, connects OBS, and starts Capture Menu with Windows.

          Press **Alt + C** (or **Create** on the controller) to open the menu.
          NOTES
          gh release create "$TAG" CaptureMenu.zip --target "$GITHUB_SHA" \
            --title "Capture Menu $TAG" --notes-file notes.md
