name: Release

# Builds CaptureMenu.zip (the app only, no tests or screenshots) and publishes it as a release.
# Three ways to start it: change the VERSION file on main (e.g. to v1.1.0), run it from the
# Actions tab with a version, or push a tag that starts with "v".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CaptureMenu.zip
        run: |
          mkdir -p out/CaptureMenu
          cp -r assets capture_menu.py config.json requirements.txt README.md \
                Setup.cmd setup.ps1 Uninstall.cmd uninstall.ps1 build_exe.bat preview.png out/CaptureMenu/
          cd out && zip -r -q ../CaptureMenu.zip CaptureMenu
          cd .. && unzip -l CaptureMenu.zip | tail -1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"
          else TAG="$(tr -d '[:space:]' < VERSION)"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"; exit 0
          fi
          cat > notes.md <<'NOTES'
          **Install in 3 steps**
          1. Download `CaptureMenu.zip` below.
          2. Right-click it → **Extract All** → **Extract**.
          3. Double-click `Setup.cmd` in the extracted folder and wait for **All set!**

          If Windows shows "Windows protected your PC", choose **More info → Run anyway**. Setup installs Python, OBS Studio and FFmpeg, copies Capture Menu to its own folder, connects OBS, starts it with Windows and checks that everything works. Already installed? Run the new `Setup.cmd` to update; your settings are kept.

          Press **Alt + C** (or **Create** on the controller) to open the menu.
          NOTES
          gh release create "$TAG" CaptureMenu.zip --target "$GITHUB_SHA" \
            --title "Capture Menu $TAG" --notes-file notes.md
